## Override que troca os providers de LLM do `processing` de `mock` para
## `gemini` (vision) e `groq` (text). Use em conjunto com o compose principal:
##
##   docker compose \
##     -f docker-compose.e2e.yml \
##     -f docker-compose.real-llm.yml \
##     up -d
##
## Pré-requisitos:
##   - GEMINI_API_KEY e GROQ_API_KEY exportadas no shell (ou em .env do
##     diretorio onde voce executa o comando).

services:
  processing:
    environment:
      LLM_VISION_PROVIDER: gemini
      LLM_TEXT_PROVIDER: groq
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_MODEL_VISION: gemini-2.5-flash
      GEMINI_MODEL_TEXT: gemini-2.5-flash
      GROQ_MODEL: llama-3.3-70b-versatile
      LLM_TEMPERATURE: "0.2"
